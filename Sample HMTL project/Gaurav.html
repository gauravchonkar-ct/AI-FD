<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ============================================================
         META & TITLE
         - charset UTF-8 ensures Markdown special characters render
         - viewport meta makes the page responsive on mobile devices
    ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Renderer</title>

    <!-- ============================================================
         EMBEDDED STYLES
         - All CSS is inline for a single-file, zero-dependency setup
         - Organized into: Reset, Layout, File Input, Content Area,
           Typography defaults (for future rendered Markdown), Footer
    ============================================================ -->
    <style>
        /* ---------- Reset & Base ---------- */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #1e293b;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Page Layout ---------- */
        .page-wrapper {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;               /* pushes footer to the bottom */
        }

        /* ---------- Header ---------- */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
        }

        header p {
            font-size: 0.95rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        /* ---------- File Input Area ----------
           - Dashed border gives a familiar "drop-zone" look
           - The native <input> is hidden; a <label> acts as the
             clickable trigger for better UX & styling control
        -------------------------------------------------------- */
